<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Profile - Bento Grid</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bento-container">
        <!-- Main Profile (takes 2x2) -->
        <div class="bento-item profile-card span-2x2">
            <h2>Player One</h2>
            <p>Level 99 Elite</p>
        </div>
        
        <!-- Stats -->
        <div class="bento-item stats-card">
            <h3>K/D Ratio</h3>
            <p class="stat">2.45</p>
        </div>
        
        <!-- Win Rate -->
        <div class="bento-item winrate-card">
            <h3>Win Rate</h3>
            <p class="stat">68%</p>
        </div>
        
        <!-- Recent Achievements -->
        <div class="bento-item achievements-card span-2-cols">
            <h3>Recent Achievements</h3>
            <ul>
                <li>🏆 First Blood</li>
                <li>🎯 Sharpshooter</li>
                <li>👑 Battle Royale Champion</li>
            </ul>
        </div>
        
        <!-- Friends Online -->
        <div class="bento-item friends-card">
            <h3>Friends Online</h3>
            <p class="stat">12</p>
        </div>

        <!-- Favorite Game -->
        <div class="bento-item game-card span-2-cols">
            <h3>Most Played</h3>
            <p class="stat">CyberStrike 2077</p>
            <p>4,500 Hours</p>
        </div>
        
        <!-- Upcoming Match -->
        <div class="bento-item match-card">
            <h3>Next Match</h3>
            <p>in 15 mins</p>
        </div>
    </div>
</body>
</html>
